<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div id="userMenu"></div>
      </header>
      <div class="banner hidden" id="pendingBanner"></div>
      <section class="stats" id="stats" aria-label="Summary"></section>

      <div class="section-head">
        <h2 id="recentTitle">Recent Transactions</h2>
        <button type="button" class="btn btn-outline btn-sm" id="viewAll">View All <span data-icon="arrow" data-size="16"></span></button>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Product</th><th>Quantity</th><th>Total</th><th>Type</th></tr></thead>
            <tbody id="txBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/actions.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
