<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archived Products · Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Archived Products</h1>
        <div id="userMenu"></div>
      </header>
      <div class="notice">Archived products are hidden from the inventory list and the POS, but nothing is deleted. Restore a product to bring it back.</div>
      <div class="toolbar">
        <label class="search-box">
          <span data-icon="search" data-size="20"></span>
          <input id="search" type="text" placeholder="Search archived product..." aria-label="Search archived product">
          <button type="button" class="clear-btn hidden" id="clearSearch" aria-label="Clear search"><span data-icon="x" data-size="16"></span></button>
        </label>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Product Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Archived</th><th>Action</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="pager" id="pager"></div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/actions.js"></script>
  <script src="../js/archived.js"></script>
</body>
</html>
