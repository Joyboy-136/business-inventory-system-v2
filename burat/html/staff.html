<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff · Sales &amp; Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Staff</h1>
        <div id="userMenu"></div>
      </header>
      <div class="toolbar">
        <label class="search-box">
          <span data-icon="search" data-size="20"></span>
          <input id="search" type="text" placeholder="Search name, ID or username..." aria-label="Search staff">
          <button type="button" class="clear-btn hidden" id="clearSearch" aria-label="Clear search"><span data-icon="x" data-size="16"></span></button>
        </label>
        <button type="button" class="btn btn-primary" id="addStaff"><span data-icon="plus" data-size="18"></span> Add Staff</button>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID Number</th><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="pager" id="pager"></div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/actions.js"></script>
  <script src="../js/staff.js"></script>
</body>
</html>
